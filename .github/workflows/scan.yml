name: Scan

on:
  schedule:
    - cron: "0 5 * * *"   # every morning, 07:00 Amsterdam (summer) / 06:00 (winter)
  workflow_dispatch:       # the "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner
        run: python3 scan.py

      - name: Save price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv
          git commit -m "Price history $(date -u +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push

      - name: Prepare site
        run: |
          mkdir -p site
          cp output/report.html site/index.html
          cp output/deals.csv output/products_to_price.csv data/history.csv site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
